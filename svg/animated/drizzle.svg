<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Drizzle</title><defs><linearGradient id="wtc-drizzle-cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient></defs><style>@keyframes wtc-drizzle-drift{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}.wtc-drizzle-c0{animation:wtc-drizzle-drift 6s ease-in-out infinite alternate}@keyframes wtc-drizzle-fall{0%{transform:translate(1px,-3px);opacity:0}25%,75%{opacity:1}100%{transform:translate(-1px,4px);opacity:0}}.wtc-drizzle-d0{animation:wtc-drizzle-fall 1.2s linear 0s infinite}.wtc-drizzle-d1{animation:wtc-drizzle-fall 1.2s linear -0.45s infinite}.wtc-drizzle-d2{animation:wtc-drizzle-fall 1.2s linear -0.9s infinite}.wtc-drizzle-d3{animation:wtc-drizzle-fall 1.2s linear -0.15s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wtc-drizzle-c0" d="M19.05 35.6A9.2 9.2 0 1 1 20.64 17.34A12.65 12.65 0 0 1 45.29 18.35A8.63 8.63 0 1 1 45.5 35.6Z" fill="url(#wtc-drizzle-cl)" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/><path class="wtc-drizzle-d0" d="M21 42l-1.3 4.32" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/><path class="wtc-drizzle-d1" d="M29 47l-1.3 4.32" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/><path class="wtc-drizzle-d2" d="M37 42l-1.3 4.32" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/><path class="wtc-drizzle-d3" d="M45 47l-1.3 4.32" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/></svg>
