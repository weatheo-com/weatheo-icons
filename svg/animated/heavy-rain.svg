<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Heavy rain</title><defs><linearGradient id="wtc-heavy-rain-cd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBD5E1"/><stop offset="1" stop-color="#94A3B8"/></linearGradient></defs><style>@keyframes wtc-heavy-rain-drift{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}.wtc-heavy-rain-c0{animation:wtc-heavy-rain-drift 6s ease-in-out infinite alternate}@keyframes wtc-heavy-rain-fall{0%{transform:translate(1px,-3px);opacity:0}25%,75%{opacity:1}100%{transform:translate(-1px,4px);opacity:0}}.wtc-heavy-rain-d0{animation:wtc-heavy-rain-fall 1.2s linear 0s infinite}.wtc-heavy-rain-d1{animation:wtc-heavy-rain-fall 1.2s linear -0.45s infinite}.wtc-heavy-rain-d2{animation:wtc-heavy-rain-fall 1.2s linear -0.9s infinite}.wtc-heavy-rain-d3{animation:wtc-heavy-rain-fall 1.2s linear -0.15s infinite}.wtc-heavy-rain-d4{animation:wtc-heavy-rain-fall 1.2s linear -0.6s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wtc-heavy-rain-c0" d="M19.05 35.6A9.2 9.2 0 1 1 20.64 17.34A12.65 12.65 0 0 1 45.29 18.35A8.63 8.63 0 1 1 45.5 35.6Z" fill="url(#wtc-heavy-rain-cd)" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/><path class="wtc-heavy-rain-d0" d="M19 40l-2.61 8.64" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-heavy-rain-d1" d="M26.5 45l-2.61 8.64" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-heavy-rain-d2" d="M34 40l-2.61 8.64" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-heavy-rain-d3" d="M41.5 45l-2.61 8.64" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-heavy-rain-d4" d="M49 40l-2.61 8.64" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/></svg>
