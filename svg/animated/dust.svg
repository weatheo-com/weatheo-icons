<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Dust</title><style>@keyframes wtc-dust-flow{0%,20%{stroke-dashoffset:0}100%{stroke-dashoffset:-200}}.wtc-dust-w0{stroke-dasharray:100 100;animation:wtc-dust-flow 3.2s linear 0s infinite}.wtc-dust-w1{stroke-dasharray:100 100;animation:wtc-dust-flow 3.2s linear -0.7s infinite}@keyframes wtc-dust-dust{0%{transform:translateX(-3px);opacity:0}30%,70%{opacity:1}100%{transform:translateX(4px);opacity:0}}.wtc-dust-p0{animation:wtc-dust-dust 2.4s linear 0s infinite}.wtc-dust-p1{animation:wtc-dust-dust 2.4s linear -0.55s infinite}.wtc-dust-p2{animation:wtc-dust-dust 2.4s linear -1.1s infinite}.wtc-dust-p3{animation:wtc-dust-dust 2.4s linear -1.65s infinite}.wtc-dust-p4{animation:wtc-dust-dust 2.4s linear -2.2s infinite}.wtc-dust-p5{animation:wtc-dust-dust 2.4s linear -0.35s infinite}.wtc-dust-p6{animation:wtc-dust-dust 2.4s linear -0.9s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wtc-dust-w0" pathLength="100" d="M10 22H40a6 6 0 1 0-6-6" fill="none" stroke="#D6A35C" stroke-width="2.5" stroke-linecap="round"/><path class="wtc-dust-w1" pathLength="100" d="M14 42H44a5 5 0 1 1-5 5" fill="none" stroke="#D6A35C" stroke-width="2.5" stroke-linecap="round"/><circle class="wtc-dust-p0" cx="16" cy="31" r="1.8" fill="#D6A35C"/><circle class="wtc-dust-p1" cx="26" cy="30" r="1.4" fill="#D6A35C"/><circle class="wtc-dust-p2" cx="36" cy="32" r="2" fill="#D6A35C"/><circle class="wtc-dust-p3" cx="47" cy="30" r="1.5" fill="#D6A35C"/><circle class="wtc-dust-p4" cx="53" cy="36" r="1.8" fill="#D6A35C"/><circle class="wtc-dust-p5" cx="22" cy="52" r="1.5" fill="#D6A35C"/><circle class="wtc-dust-p6" cx="52" cy="50" r="1.4" fill="#D6A35C"/></svg>
