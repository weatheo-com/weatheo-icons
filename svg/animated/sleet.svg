<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Sleet</title><defs><linearGradient id="wtc-sleet-cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient></defs><style>@keyframes wtc-sleet-drift{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}.wtc-sleet-c0{animation:wtc-sleet-drift 6s ease-in-out infinite alternate}@keyframes wtc-sleet-fall{0%{transform:translate(1px,-3px);opacity:0}25%,75%{opacity:1}100%{transform:translate(-1px,4px);opacity:0}}.wtc-sleet-d0{animation:wtc-sleet-fall 1.2s linear 0s infinite}.wtc-sleet-d1{animation:wtc-sleet-fall 1.2s linear -0.45s infinite}@keyframes wtc-sleet-snow{0%{transform:translateY(-3px) rotate(0);opacity:0}20%,80%{opacity:1}100%{transform:translateY(4px) rotate(120deg);opacity:0}}.wtc-sleet-f0{transform-box:fill-box;transform-origin:center;animation:wtc-sleet-snow 3s linear 0s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wtc-sleet-c0" d="M19.05 35.6A9.2 9.2 0 1 1 20.64 17.34A12.65 12.65 0 0 1 45.29 18.35A8.63 8.63 0 1 1 45.5 35.6Z" fill="url(#wtc-sleet-cl)" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/><path class="wtc-sleet-d0" d="M22 41l-2.32 7.68" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-sleet-d1" d="M44 41l-2.32 7.68" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-sleet-f0" d="M32 42.5V51.5M28.1 44.75L35.9 49.25M28.1 49.25L35.9 44.75" stroke="#60A5FA" stroke-width="1.75" stroke-linecap="round"/></svg>
