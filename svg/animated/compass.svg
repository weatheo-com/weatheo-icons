<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Wind direction</title><defs><linearGradient id="wtc-compass-dial" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient></defs><style>.wtc-compass-ndl{transform-box:view-box;transform-origin:32px 32px;animation:wtc-compass-wob 2.6s ease-in-out infinite alternate}@keyframes wtc-compass-wob{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="32" cy="32" r="24" fill="url(#wtc-compass-dial)" stroke="#94A3B8" stroke-width="2.5"/><path d="M32 8v4M56 32h-4M32 56v-4M8 32h4" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/><g class="wtc-compass-ndl"><path d="M32 12L38 32H26Z" fill="#EF4444"/><path d="M26 32H38L32 52Z" fill="#94A3B8"/><circle cx="32" cy="32" r="2.5" fill="#fff"/></g></svg>
