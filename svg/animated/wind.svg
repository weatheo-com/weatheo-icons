<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Wind</title><style>@keyframes wtc-wind-flow{0%,20%{stroke-dashoffset:0}100%{stroke-dashoffset:-200}}.wtc-wind-w0{stroke-dasharray:100 100;animation:wtc-wind-flow 3.2s linear 0s infinite}.wtc-wind-w1{stroke-dasharray:100 100;animation:wtc-wind-flow 3.2s linear -0.7s infinite}.wtc-wind-w2{stroke-dasharray:100 100;animation:wtc-wind-flow 3.2s linear -1.4s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wtc-wind-w0" pathLength="100" d="M13 24H39a6 6 0 1 0-6-6" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/><path class="wtc-wind-w1" pathLength="100" d="M9 33H49a6 6 0 1 1-6 6" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/><path class="wtc-wind-w2" pathLength="100" d="M15 44H33a5 5 0 1 1-5 5" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/></svg>
