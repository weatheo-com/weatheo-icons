<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Rain</title><defs><linearGradient id="wtc-rain-cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient></defs><style>@keyframes wtc-rain-drift{from{transform:translateX(-1.5px)}to{transform:translateX(1.5px)}}.wtc-rain-c0{animation:wtc-rain-drift 6s ease-in-out infinite alternate}@keyframes wtc-rain-fall{0%{transform:translate(1px,-3px);opacity:0}25%,75%{opacity:1}100%{transform:translate(-1px,4px);opacity:0}}.wtc-rain-d0{animation:wtc-rain-fall 1.2s linear 0s infinite}.wtc-rain-d1{animation:wtc-rain-fall 1.2s linear -0.45s infinite}.wtc-rain-d2{animation:wtc-rain-fall 1.2s linear -0.9s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path class="wtc-rain-c0" d="M19.05 35.6A9.2 9.2 0 1 1 20.64 17.34A12.65 12.65 0 0 1 45.29 18.35A8.63 8.63 0 1 1 45.5 35.6Z" fill="url(#wtc-rain-cl)" stroke="#CBD5E1" stroke-width="1.5" stroke-linejoin="round"/><path class="wtc-rain-d0" d="M23 41l-2.32 7.68" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-rain-d1" d="M33 44l-2.32 7.68" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/><path class="wtc-rain-d2" d="M43 41l-2.32 7.68" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/></svg>
