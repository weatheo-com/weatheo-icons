<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img"><title>Temperature falling</title><defs><linearGradient id="wtc-thermometer-colder-merc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs><style>.wtc-thermometer-colder-m{transform-box:fill-box;transform-origin:bottom;animation:wtc-thermometer-colder-m 3s ease-in-out infinite alternate}@keyframes wtc-thermometer-colder-m{from{transform:scaleY(.82)}to{transform:scaleY(1)}}.wtc-thermometer-colder-ar{animation:wtc-thermometer-colder-ar 1.6s ease-in-out infinite alternate}@keyframes wtc-thermometer-colder-ar{from{transform:translateY(-1.5px)}to{transform:translateY(1.5px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M21 39.13V13A5 5 0 0 1 31 13V39.13A8.5 8.5 0 1 1 21 39.13Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2"/><rect class="wtc-thermometer-colder-m" x="24" y="30" width="4" height="16" rx="2" fill="url(#wtc-thermometer-colder-merc)"/><circle cx="26" cy="46" r="5.5" fill="url(#wtc-thermometer-colder-merc)"/><path d="M34 14h4M34 20h2.5M34 26h4M34 32h2.5" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/><path class="wtc-thermometer-colder-ar" d="M49 16V30M43.68 24.68L49 30L54.32 24.68" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
